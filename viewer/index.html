<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aircraft Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #14181f; overflow: hidden; font: 14px system-ui, sans-serif; color: #dfe5ee; }
  #stage { position: fixed; inset: 0; }
  #panel { position: fixed; top: 12px; left: 12px; padding: 12px 14px; background: #0d1015cc; border: 1px solid #2a323e; border-radius: 8px; display: grid; gap: 8px; }
  #panel label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  select, button { background: #1c222c; color: inherit; border: 1px solid #2f3846; border-radius: 6px; padding: 5px 8px; font: inherit; }
  button { cursor: pointer; }
  #status { position: fixed; inset: auto 0 40% 0; text-align: center; font-size: 16px; }
  #help { position: fixed; bottom: 12px; left: 12px; color: #8b95a5; font-size: 12px; }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<div id="stage"></div>
<div id="panel">
  <select id="aircraft"></select>
  <label><input type="checkbox" id="spin"> Auto-rotate</label>
  <label><input type="checkbox" id="plain"> Untextured</label>
  <label><input type="checkbox" id="wire"> Wireframe</label>
  <label><input type="checkbox" id="grid" checked> Grid</label>
  <label><input type="checkbox" id="axes"> Axes</label>
  <button id="reset">Reset view</button>
</div>
<div id="status">Loading…</div>
<div id="help">Drag: rotate · Right-drag: pan · Wheel: zoom</div>
<script type="module" src="../src/viewer/viewer.js"></script>
</body>
</html>
